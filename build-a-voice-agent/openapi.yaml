openapi: 3.1.0
info:
  title: Home Replicator Support API
  version: 0.1.0
  description: API contract used by the Vapi customer-service agent and local webinar test endpoint.
servers:
  - url: http://localhost:3000
paths:
  /api/customers:
    get:
      summary: Look up a customer by email or phone
      parameters:
        - name: email
          in: query
          schema: { type: string, format: email }
        - name: phone
          in: query
          schema: { type: string }
      responses:
        '200': { description: Customer found, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { description: Customer not found }
  /api/tickets:
    post:
      summary: Create a support ticket and start the Inngest workflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTicketRequest' } } }
      responses:
        '201': { description: Ticket created, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
  /test:
    post:
      summary: Local test shortcut for the full long-running workflow
      description: Accepts the exact same body as POST /api/tickets, without API-token enforcement.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTicketRequest' } } }
      responses:
        '201': { description: Workflow event accepted }
  /api/tickets/{ticketId}/resolve:
    post:
      summary: Resume a human-review wait with a technician answer
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [answer], properties: { answer: { type: string } } } } }
      responses: { '200': { description: Resolution event sent } }
  /api/tickets/{ticketId}/feedback:
    post:
      summary: Record whether the customer found the reply helpful
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [helpful], properties: { helpful: { type: boolean } } } } }
      responses: { '200': { description: Feedback event sent } }
components:
  parameters:
    TicketId: { name: ticketId, in: path, required: true, schema: { type: string } }
  schemas:
    Customer:
      type: object
      required: [id, name, email, phone, product, replicator_model, firmware_version]
      properties:
        id: { type: string, example: cus_amanda }
        name: { type: string, example: Amanda Martin }
        email: { type: string, format: email }
        phone: { type: string }
        product: { type: string, example: Home Replicator }
        replicator_model: { type: string, example: XR-200 }
        firmware_version: { type: string, example: 9.4.0 }
        warranty_status: { type: string, example: active }
    CreateTicketRequest:
      type: object
      required: [customerId, issue]
      properties:
        customerId: { type: string, example: cus_amanda }
        issue: { type: string, example: My replicator stopped working after the latest update. }
        deviceModel: { type: string, example: XR-200 }
        firmwareVersion: { type: string, example: 9.4.0 }
        symptom: { type: string, example: The thermal-safety light flashes and no item is replicated. }
        errorCode: { type: string, example: THERM-94 }
        followUpMethod: { type: string, enum: [email, callback], example: email }
    Ticket:
      allOf:
        - $ref: '#/components/schemas/CreateTicketRequest'
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string }
            status: { type: string, example: researching }
            created_at: { type: string, format: date-time }
