openapi: 3.1.0
info:
  title: Inngest Webinar Voice Support API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /api/customers:
    get:
      summary: Look up a customer directly by email or phone
      parameters:
        - { name: contact, in: query, schema: { type: string }, description: Email address or phone number }
        - { name: email, in: query, schema: { type: string, format: email } }
        - { name: phone, in: query, schema: { type: string } }
      responses:
        '200':
          description: Lookup completed, whether or not a customer matched
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [matched, customerId, product, deviceModel, firmwareVersion]
                    properties:
                      matched: { type: boolean, const: true }
                      customerId: { type: string }
                      product: { type: string }
                      deviceModel: { type: string }
                      firmwareVersion: { type: string }
                  - type: object
                    additionalProperties: false
                    required: [matched, nextAction]
                    properties:
                      matched: { type: boolean, const: false }
                      nextAction: { type: string, const: recheck_contact }
  /api/tickets:
    post:
      summary: Create a ticket and emit support/ticket.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportTicket' }
      responses:
        '200':
          description: A prior ticket for this request ID was returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketCreationResult' }
        '201':
          description: Ticket created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketCreationResult' }
        '409':
          description: The request ID was previously used with different content
        '503':
          description: The ticket was saved but workflow dispatch failed and can be retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDispatchFailure' }
  /api/tickets/{ticketId}/resolve:
    post:
      summary: Resume a workflow waiting for human resolution
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties: { answer: { type: string } }
      responses:
        '200': { description: Resolution event accepted }
        '400': { description: Invalid resolution body }
        '404': { description: Ticket not found }
        '409': { description: Ticket is not waiting for human review }
        '503': { description: Resolution event dispatch failed and can be retried }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    TicketCreationResult:
      type: object
      additionalProperties: false
      required: [ok, created, ticketId, ticketReference, ticketSaved, workflowStarted, status, duplicate, retryable]
      properties:
        ok: { type: boolean, const: true }
        created: { type: boolean }
        ticketId: { type: string }
        ticketReference: { type: string, pattern: '^REP-[0-9]{6}$' }
        ticketSaved: { type: boolean, const: true }
        workflowStarted: { type: boolean, const: true }
        status: { type: string }
        duplicate: { type: boolean }
        retryable: { type: boolean, const: false }
    TicketDispatchFailure:
      type: object
      additionalProperties: false
      required: [ok, error, ticketId, ticketReference, ticketSaved, workflowStarted, status, retryable]
      properties:
        ok: { type: boolean, const: false }
        error: { type: string, const: workflow_dispatch_failed }
        ticketId: { type: string }
        ticketReference: { type: string, pattern: '^REP-[0-9]{6}$' }
        ticketSaved: { type: boolean, const: true }
        workflowStarted: { type: boolean, const: false }
        status: { type: string, const: event_failed }
        retryable: { type: boolean, const: true }
    CreateSupportTicket:
      type: object
      additionalProperties: false
      required: [requestId, customerId, issue]
      properties:
        requestId: { type: string, description: Server-trusted operation identifier used for idempotency }
        customerId: { type: string, example: cus_amanda }
        issue: { type: string }
        deviceModel: { type: string, example: XR-200 }
        firmwareVersion: { type: string, example: 9.4.0 }
        symptom: { type: string }
        errorCode: { type: string, example: THERM-94 }
